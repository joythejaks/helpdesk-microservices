name: Flutter CI

on:
  pull_request:
    paths:
      - "flutter_app/helpdesk_app/**"
      - ".github/workflows/flutter-ci.yml"
  push:
    branches: [main]
    paths:
      - "flutter_app/helpdesk_app/**"
      - ".github/workflows/flutter-ci.yml"

defaults:
  run:
    working-directory: flutter_app/helpdesk_app

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK (no signing, verifies the build itself)
        run: flutter build apk --release

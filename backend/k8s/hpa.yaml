# CPU-based autoscaling for the four stateless app services. Safe to scale
# out now that rate limiting is shared through Redis (phase 9) instead of
# per-process. Needs metrics-server: scripts/install-metrics-server.sh.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api-gateway }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---

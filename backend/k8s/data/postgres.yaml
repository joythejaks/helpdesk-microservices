# One single-replica Postgres per service (database-per-service). HA via an
# operator is phase 13, deliberately not here.
apiVersion: v1
kind: Service
metadata:
  name: auth-db
spec:
  selector: { app: auth-db }
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-db
spec:
  serviceName: auth-db
  replicas: 1
  selector:
    matchLabels: { app: auth-db }
  template:
    metadata:
      labels: { app: auth-db }
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - { name: POSTGRES_USER, value: auth }
            - { name: POSTGRES_DB, value: auth_db }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: db-secrets, key: AUTH_DB_PASSWORD } }
            # A subdirectory, because a fresh PVC mount root may not be empty.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "auth", "-d", "auth_db"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "auth", "-d", "auth_db"] }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
---

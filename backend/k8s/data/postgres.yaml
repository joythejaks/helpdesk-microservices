# One CloudNativePG cluster per service (database-per-service): a primary plus
# one streaming replica, with automatic failover. The operator exposes
#   <name>-rw  the current primary (apps write here; the Service follows a
#              promotion)
#   <name>-ro  replicas only
#   <name>-r   any instance (used by the backup jobs)
#
# Replication is asynchronous (the default): failover is fast and writes keep
# working if the replica is down, but a primary that dies abruptly can lose
# its last un-replicated transactions (RPO > 0). Synchronous replication
# (postgresql.synchronous / minSyncReplicas) trades that for write
# availability; not enabled here.
#
# On a single-node cluster the two instances share a node, so this survives a
# pod/process failure, not the loss of the node. The anti-affinity below
# spreads them when there is more than one node.
#
# Credentials come from the *-db-credentials basic-auth Secrets that
# scripts/gen-secrets.sh derives from the same values the apps read from
# db-secrets, so the two cannot drift.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: auth-db
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:15
  bootstrap:
    initdb:
      database: auth_db
      owner: auth
      secret:
        name: auth-db-credentials
  storage:
    size: 1Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred
---

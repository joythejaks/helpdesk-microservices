# A 3-replica RabbitMQ cluster managed by the RabbitMQ Cluster Operator.
# Three, not two: quorum queues need a majority to elect a leader and accept
# writes, so 3 tolerates losing one.
#
# The operator creates the client Service `rabbitmq` (5672 amqp, 15672
# management), so the `rabbitmq` host in RABBITMQ_URL is unchanged.
# Credentials: the operator adopts the rabbitmq-default-user Secret that
# scripts/gen-secrets.sh creates from the same user/password as
# rabbitmq-secret's URL (never the guest default).
#
# Quorum queues are opted into per-application with RABBITMQ_QUEUE_TYPE=quorum
# (see the ticket/notification ConfigMaps): the ticket_created queue and its
# dead-letter queue are quorum queues; the per-replica broadcast queue stays
# classic because it is exclusive + auto-delete, which quorum queues don't
# support, and it is meant to vanish with its connection.
#
# On a single-node cluster the replicas share a node (pod-level failover, not
# node loss); the anti-affinity spreads them across nodes when there are any.
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
spec:
  replicas: 3
  persistence:
    storage: 1Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: rabbitmq

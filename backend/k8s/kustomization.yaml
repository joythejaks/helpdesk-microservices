apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Render + apply (LoadRestrictionsNone lets the configMapGenerators below
# reuse backend/Caddyfile and backend/observability/* instead of copies):
#   kubectl kustomize --load-restrictor=LoadRestrictionsNone backend/k8s | kubectl apply -f -
# scripts/apply.sh wraps this together with image builds and secret creation.
namespace: helpdesk

resources:
  - namespace.yaml
  - apps/auth-service.yaml
  - apps/ticket-service.yaml
  - apps/notification-service.yaml
  - apps/api-gateway.yaml
  - data/postgres.yaml
  - data/rabbitmq.yaml
  - data/redis.yaml
  - data/backups.yaml
  - observability.yaml
  - edge/caddy.yaml
  - hpa.yaml

configMapGenerator:
  - name: caddyfile
    files:
      - Caddyfile=../Caddyfile
  - name: prometheus-config
    files:
      - prometheus.yml=../observability/prometheus.yml
  - name: grafana-datasources
    files:
      - prometheus.yml=../observability/grafana/provisioning/datasources/prometheus.yml
  - name: grafana-dashboard-provider
    files:
      - dashboards.yml=../observability/grafana/provisioning/dashboards/dashboards.yml
  - name: grafana-dashboards
    files:
      - helpdesk-overview.json=../observability/grafana/dashboards/helpdesk-overview.json

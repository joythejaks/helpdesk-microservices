apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
data:
  APP_PORT: "8083"
  DB_HOST: notification-db-rw
  DB_PORT: "5432"
  DB_USER: notification
  DB_NAME: notification_db
  # Never "*" outside local dev. Set to the real frontend origin(s),
  # comma-separated, when deploying.
  ALLOWED_ORIGINS: https://localhost
  # Trust X-Forwarded-For only from the pod network (Caddy lives there), so
  # the /ws limiter keys on the real client instead of Caddy's IP. Must
  # cover the cluster's pod CIDR (10.244.0.0/16 on Docker Desktop; check
  # with `kubectl cluster-info dump | grep -m1 cluster-cidr` elsewhere).
  TRUSTED_PROXIES: 10.244.0.0/16
  # Must match ticket-service: both declare the ticket_created queue.
  RABBITMQ_QUEUE_TYPE: quorum
  WS_RATE_LIMIT_RPS: "5"
  WS_RATE_LIMIT_BURST: "10"
  MAX_WS_CONNECTIONS: "1000"
  REDIS_URL: redis://redis:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      # WebSocket clients get dropped on a pod restart, so give shutdown
      # (which closes them explicitly) a little room.
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
      containers:
        - name: notification-service
          image: helpdesk/notification-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef: { name: notification-service-config }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-secrets, key: NOTIFICATION_DB_PASSWORD } }
            - name: RABBITMQ_URL
              valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: RABBITMQ_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_SECRET } }
          # Startup waits on its database (retrying), so hold liveness off
          # for up to ~150s instead of killing the pod mid-startup.
          startupProbe:
            httpGet: { path: /healthz, port: 8083 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: 8083 }
            periodSeconds: 10
          # /health also requires the RabbitMQ consumer to be connected.
          readinessProbe:
            httpGet: { path: /health, port: 8083 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
# ClusterIP only: external traffic (including /ws) comes in through Caddy.
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector: { app: notification-service }
  ports:
    - port: 8083
      targetPort: 8083

apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  APP_PORT: "8080"
  AUTH_SERVICE_URL: http://auth-service:8081
  TICKET_SERVICE_URL: http://ticket-service:8082
  # Never "*" outside local dev. Set to the real frontend origin(s),
  # comma-separated, when deploying.
  ALLOWED_ORIGINS: https://localhost
  RATE_LIMIT_RPS: "10"
  RATE_LIMIT_BURST: "20"
  REDIS_URL: redis://redis:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api-gateway
          image: helpdesk/api-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: api-gateway-config }
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_SECRET } }
            - name: INTERNAL_SHARED_SECRET
              valueFrom: { secretKeyRef: { name: app-secrets, key: INTERNAL_SHARED_SECRET } }
          # The gateway has no backing dependency of its own, so /health is
          # already an unconditional 200 and serves as both probes.
          startupProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
          # Deliberately small CPU request so the HPA (hpa.yaml) triggers
          # under a laptop-sized load test.
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector: { app: api-gateway }
  ports:
    - port: 8080
      targetPort: 8080

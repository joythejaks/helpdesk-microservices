basePath: /auth
definitions:
  http.ChangePasswordRequest:
    properties:
      new_password:
        maxLength: 72
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  http.CreateStaffRequest:
    properties:
      department:
        maxLength: 100
        type: string
      email:
        type: string
      name:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      role:
        type: string
    required:
    - email
    - password
    - role
    type: object
  http.LoginRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 72
        type: string
    required:
    - email
    - password
    type: object
  http.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  http.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  http.RegisterRequest:
    properties:
      department:
        maxLength: 100
        type: string
      email:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - department
    - email
    - name
    - password
    type: object
  http.TokenPair:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  http.UpdateAvailabilityRequest:
    properties:
      availability:
        type: string
    required:
    - availability
    type: object
  http.UpdateProfileRequest:
    properties:
      department:
        maxLength: 100
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  http.UserResponse:
    properties:
      availability:
        type: string
      department:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        type: string
    type: object
  response.Response:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    Authentication endpoints as clients see them: through the API Gateway (every path is prefixed with /auth).
    "Try it out" calls the gateway, so the origin of this page must be listed in the gateway ALLOWED_ORIGINS.
    Send the access token as `Bearer <token>` in the Authorization header.
  title: Helpdesk Auth Service API
  version: "1.0"
paths:
  /admin/agents:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/http.UserResponse'
                  type: array
              type: object
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List agent accounts
      tags:
      - Admin
  /admin/staff:
    post:
      consumes:
      - application/json
      description: Admin only. There is no public registration path for these roles.
      parameters:
      - description: 'Staff account data (role: agent or admin)'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.CreateStaffRequest'
      produces:
      - application/json
      responses:
        "200":
          description: staff account created
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: invalid input
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: email already registered
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Create an agent or admin account
      tags:
      - Admin
  /change-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Current and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: unauthorized or wrong password
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Change own password
      tags:
      - Auth
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates the user and returns an access token and a refresh
        token. Each login starts its own session (up to MAX_SESSIONS_PER_USER per
        user; the oldest is evicted).
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token pair
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/http.TokenPair'
              type: object
        "400":
          description: invalid input
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: invalid credentials
          schema:
            $ref: '#/definitions/response.Response'
        "429":
          description: rate limited
          schema:
            $ref: '#/definitions/response.Response'
      summary: Log in
      tags:
      - Auth
  /logout:
    post:
      consumes:
      - application/json
      description: Without a body, ends all sessions of the user. With `refresh_token`
        in the body, ends only that device's session.
      parameters:
      - description: Refresh token of the session to end (optional)
        in: body
        name: request
        schema:
          $ref: '#/definitions/http.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: logged out
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Log out
      tags:
      - Auth
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/http.UserResponse'
              type: object
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Current user profile
      tags:
      - Auth
    patch:
      consumes:
      - application/json
      parameters:
      - description: New name and department
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/http.UserResponse'
              type: object
        "400":
          description: invalid input
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Update own profile
      tags:
      - Auth
  /me/availability:
    patch:
      consumes:
      - application/json
      parameters:
      - description: New availability status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.UpdateAvailabilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: invalid availability value
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Update own availability
      tags:
      - Auth
  /refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a refresh token for a new token pair (token rotation).
        Only the presented session is rotated; a replayed token is rejected with 401.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New token pair
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/http.TokenPair'
              type: object
        "400":
          description: invalid input
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: invalid refresh token
          schema:
            $ref: '#/definitions/response.Response'
        "429":
          description: rate limited
          schema:
            $ref: '#/definitions/response.Response'
      summary: Refresh tokens
      tags:
      - Auth
  /register:
    post:
      consumes:
      - application/json
      description: Creates a new account. Public registration always creates the `user`
        role.
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: registered
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: invalid input
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: email already registered
          schema:
            $ref: '#/definitions/response.Response'
        "429":
          description: rate limited
          schema:
            $ref: '#/definitions/response.Response'
      summary: Register a new user
      tags:
      - Auth
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
